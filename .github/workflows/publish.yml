name: CI - Build & Release

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

concurrency:
    group: build-release-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    BUN_VERSION: "1.3.5"

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            automatic_release: ${{ steps.release-plan.outputs.automatic_release }}
            new_version: ${{ steps.release-plan.outputs.new_version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Determine automatic patch release
              if: github.event_name == 'push'
              id: release-plan
              shell: bash
              run: |
                  LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
                  if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                    MAJOR="${BASH_REMATCH[1]}"
                    MINOR="${BASH_REMATCH[2]}"
                    PATCH="${BASH_REMATCH[3]}"
                    COMMIT_RANGE="$LATEST_TAG..HEAD"
                  else
                    BASE_VERSION=$(node -p "require('./package.json').version")
                    if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      echo "package.json version is not semantic: $BASE_VERSION" >&2
                      exit 1
                    fi
                    MAJOR="${BASH_REMATCH[1]}"
                    MINOR="${BASH_REMATCH[2]}"
                    PATCH="${BASH_REMATCH[3]}"
                    COMMIT_RANGE="HEAD"
                  fi

                  COMMIT_MESSAGES=$(git log "$COMMIT_RANGE" --format=%B)
                  if grep -Fqi '[release]' <<< "$COMMIT_MESSAGES"; then
                    NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
                    if git rev-parse --verify "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
                      echo "Tag v$NEW_VERSION already exists." >&2
                      exit 1
                    fi
                    echo "automatic_release=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
                    echo "Automatic release: ${LATEST_TAG:-package.json} -> v$NEW_VERSION"
                  else
                    echo "automatic_release=false" >> "$GITHUB_OUTPUT"
                    echo "No [release] marker found in $COMMIT_RANGE."
                  fi

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Set automatic release version
              if: steps.release-plan.outputs.automatic_release == 'true'
              run: npm version "${{ steps.release-plan.outputs.new_version }}" --no-git-tag-version

            - name: Run linter
              run: bun run lint

            - name: Run type check
              run: bun run typecheck

            - name: Run tests
              run: bun run test

            - name: Build extension
              run: bun run build

            - name: Package extension
              run: bunx vsce package --no-dependencies

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-vsix
                  path: "*.vsix"

    tag:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && needs.build.outputs.automatic_release == 'true'
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Create git tag
              env:
                  NEW_VERSION: ${{ needs.build.outputs.new_version }}
              run: |
                  TAG="v$NEW_VERSION"
                  if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists." >&2
                    exit 1
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$TAG" "$GITHUB_SHA"
                  git push origin "refs/tags/$TAG"

    release:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.automatic_release != 'true'
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check if version changed
              id: version-check
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  echo "Current version: $CURRENT_VERSION"

                  if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                    git checkout HEAD~1 -- package.json
                    PREVIOUS_VERSION=$(node -p "require('./package.json').version")
                    git checkout HEAD -- package.json
                  else
                    PREVIOUS_VERSION="0.0.0"
                  fi

                  echo "Previous version: $PREVIOUS_VERSION"

                  if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
                    echo "version_changed=true" >> $GITHUB_OUTPUT
                    echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                  else
                    echo "version_changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Setup Node.js
              if: steps.version-check.outputs.version_changed == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup Bun
              if: steps.version-check.outputs.version_changed == 'true'
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install release dependencies
              if: steps.version-check.outputs.version_changed == 'true'
              run: bun install --frozen-lockfile

            - name: Check publish status
              if: steps.version-check.outputs.version_changed == 'true'
              id: publish-status
              run: node scripts/check-extension-publish-status.js

            - name: Download VSIX artifact
              if: steps.version-check.outputs.version_changed == 'true'
              uses: actions/download-artifact@v4
              with:
                  name: extension-vsix

            - name: Publish to VS Code Marketplace
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.vsce_published != 'true'
              run: |
                  VSIX_PATH=$(ls *.vsix | head -n 1)
                  bunx vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Skip VS Code Marketplace publish
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.vsce_published == 'true'
              run: echo "Version ${{ steps.version-check.outputs.new_version }} is already published to VS Code Marketplace. Skipping."

            - name: Publish to Open VSX
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.ovsx_published != 'true'
              run: |
                  VSIX_PATH=$(ls *.vsix | head -n 1)
                  bunx ovsx publish -p "$OVSX_PAT" "$VSIX_PATH"
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}

            - name: Skip Open VSX publish
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.ovsx_published == 'true'
              run: echo "Version ${{ steps.version-check.outputs.new_version }} is already published to Open VSX. Skipping."

            - name: Create git tag
              if: steps.version-check.outputs.version_changed == 'true'
              run: |
                  VERSION="v$NEW_VERSION"
                  if git rev-parse "$VERSION" >/dev/null 2>&1; then
                    echo "Tag $VERSION already exists, skipping tag creation."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$VERSION"
                  git push origin "$VERSION"
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}

            - name: Check if GitHub release exists
              if: steps.version-check.outputs.version_changed == 'true'
              id: github-release-check
              run: |
                  VERSION="v$NEW_VERSION"
                  if gh release view "$VERSION" >/dev/null 2>&1; then
                    echo "release_exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "release_exists=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release and upload VSIX
              if: steps.version-check.outputs.version_changed == 'true' && steps.github-release-check.outputs.release_exists != 'true'
              run: gh release create "v$NEW_VERSION" *.vsix --generate-notes
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Update GitHub Release asset
              if: steps.version-check.outputs.version_changed == 'true' && steps.github-release-check.outputs.release_exists == 'true'
              run: gh release upload "v$NEW_VERSION" *.vsix --clobber
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
